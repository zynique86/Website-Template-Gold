<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>结算付款 | 金玉良缘珠宝</title>
  <meta name="description" content="填写收货信息并完成付款">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
  <header data-header></header>
  <main class="container" data-checkout>
    <div class="page-title"><h1>结算付款</h1></div>
    <div class="checkout-layout">
      <form data-checkout-form>
        <section class="panel">
          <h2>1. 收货信息</h2>
          <div class="fields">
            <label>收货人<input name="name" required autocomplete="name"></label>
            <label>手机号<input name="phone" type="tel" required maxlength="11" placeholder="11位手机号" autocomplete="tel"></label>
            <label>省 / 市 / 区<input name="region" required placeholder="例如：广东省 深圳市 罗湖区"></label>
            <label>邮政编码<input name="zip" inputmode="numeric" maxlength="6"></label>
            <label class="full">详细地址<input name="address" required placeholder="街道、门牌号" autocomplete="street-address"></label>
            <label class="full">订单备注（选填）<textarea name="note" rows="2" placeholder="例如：刻字内容、礼盒包装"></textarea></label>
          </div>
        </section>
        <section class="panel">
          <h2>2. 支付方式</h2>
          <div class="pay-options">
            <label class="pay-option"><input type="radio" name="pay" value="wechat" checked><span>微信支付</span></label>
            <label class="pay-option"><input type="radio" name="pay" value="alipay"><span>支付宝</span></label>
            <label class="pay-option"><input type="radio" name="pay" value="card"><span>银行卡</span></label>
            <label class="pay-option"><input type="radio" name="pay" value="cod"><span>货到付款</span></label>
          </div>
          <div class="fields" data-card-fields hidden>
            <label class="full">卡号<input name="cardNo" inputmode="numeric" placeholder="演示用，请勿填写真实卡号"></label>
            <label>有效期<input name="cardExp" placeholder="MM/YY"></label>
            <label>持卡人<input name="cardName"></label>
          </div>
          <p class="notice">演示模板：点击付款只会模拟支付流程，不会产生任何真实扣款。接入真实支付需对接微信支付、支付宝等商户接口。</p>
        </section>
        <button class="btn btn-block" type="submit">确认并付款</button>
      </form>
      <aside class="summary" data-checkout-summary></aside>
    </div>
  </main>
  <footer data-footer></footer>
  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script src="js/effects.js"></script>
</body>
</html>
